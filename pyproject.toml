[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brain-entity"
version = "6.1.0"
description = "纯原生 Python 类脑智能体：脉冲神经网络 + STDP + 多巴胺奖励 + 三级记忆 + 意识/认知子系统，核心零第三方依赖"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "SnailSnowgit", email = "3332530788@qq.com" }]
keywords = ["spiking-neural-network", "cognitive-architecture", "brain-inspired", "STDP", "reinforcement-learning", "consciousness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心零依赖，仅需标准库
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "seaborn>=0.12", "pandas>=1.3"]
lancedb = ["lancedb"]
llm = ["transformers>=4.30", "torch>=2.0", "pillow>=9.0"]
all = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "pandas>=1.3",
    "lancedb",
    "transformers>=4.30",
    "torch>=2.0",
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/SnailSnowgit/ai-brain-entity"
Repository = "https://github.com/SnailSnowgit/ai-brain-entity"

[tool.setuptools]
py-modules = ["ai_brain_entity", "swarm", "memory_store"]
